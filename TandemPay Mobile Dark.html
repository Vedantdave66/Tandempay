<script type="text/babel">
const {createElement:e,useState,useEffect} = React;

/* ─── Tokens (exact from webapp) ─────────────────────────────── */
const G6='#22C55E',G7='#4ADE80',G4='#4ADE80',G3='#86EFAC',G1='rgba(34,197,94,.16)',G0='rgba(34,197,94,.09)';

/* ─── Balance math ────────────────────────────────────────────── */
function netOf(g){
  const net={};g.members.forEach(m=>net[m]=0);
  g.expenses.forEach(x=>{
    net[x.paidBy]=(net[x.paidBy]||0)+x.amount;
    const ea=x.amount/x.split.length;
    x.split.forEach(pp=>{net[pp]=(net[pp]||0)-ea;});
  });
  return net;
}
function settleFor(g,me='you'){
  const net=netOf(g);
  const cred=Object.entries(net).filter(([,v])=>v>0.01).sort((a,b)=>b[1]-a[1]);
  let rem=Math.max(0,-(net[me]||0));const out=[];
  for(const [id,v] of cred){if(rem<=0.01)break;const pay=Math.min(rem,v);out.push({from:me,to:id,amount:pay});rem-=pay;}
  return out;
}

  mini:{rect:{w:32,h:52,r:'6px 6px 0 0',et:10,el:8,es:5,eg:6},tall:{w:22,h:64,r:'4px 4px 0 0',et:12,el:4,es:5,eg:4},semi:{w:56,h:30,r:'28px 28px 0 0',et:8,el:19,es:5,eg:8},round:{w:40,h:52,r:'20px 20px 0 0',et:12,el:12,es:5,eg:6}},

  card:{rect:{w:38,h:64,r:'7px 7px 0 0',et:12,el:9,es:6,eg:7},tall:{w:28,h:80,r:'4px 4px 0 0',et:15,el:5,es:6,eg:5},semi:{w:66,h:38,r:'33px 33px 0 0',et:10,el:22,es:6,eg:9},round:{w:50,h:64,r:'25px 25px 0 0',et:14,el:14,es:6,eg:7}},

function Char({shape='rect',color='#6B7280',variant='mini'}){
  const t=CFGS[variant]||CFGS.mini,c=t[shape]||t.rect;
  return e('div',{style:{position:'relative',width:c.w,height:c.h,backgroundColor:color,borderRadius:c.r,flexShrink:0}},
    e('div',{style:{position:'absolute',display:'flex',top:c.et,left:c.el,gap:c.eg}},
      e('div',{style:{width:c.es,height:c.es,background:'#1A1A1A',borderRadius:'50%',opacity:.72}}),
      e('div',{style:{width:c.es,height:c.es,background:'#1A1A1A',borderRadius:'50%',opacity:.72}}),
    )
  );
}

/* ─── Icons ───────────────────────────────────────────────────── */
const ICONS={

  users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11',
  bell:'M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
  wallet:'M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-4M3 7h16M17 13h.01M17 13a1.5 1.5 0 1 0 0 .01',
  user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
  plus:'M12 5v14M5 12h14',
  arrowLeft:'M19 12H5M12 19l-7-7 7-7',

  crown:'M3 17l2-9 4.5 4L12 5l2.5 7L19 8l2 9H3z',
  send:'M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z',
  clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2',

  shield:'M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4z',
  link:'M9 15l6-6M8.5 13.5l-2 2a3 3 0 1 0 4 4l2-2M15.5 10.5l2-2a3 3 0 1 0-4-4l-2 2',
  chev:'M9 18l6-6-6-6',
  palette:'M12 22a10 10 0 1 1 0-20 8 8 0 0 1 0 16h-2a2 2 0 0 0 0 4M8.5 9.5h.01M15.5 9.5h.01',
  repeat:'M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3',
};
function Ico({n,sz=20,sw=2,col='currentColor',style:s}){
  return e('svg',{width:sz,height:sz,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round',style:s},

}

/* ─── Status Bar ──────────────────────────────────────────────── */
function StatusBar(){
  return e('div',{style:{height:56,display:'flex',alignItems:'flex-end',padding:'0 26px 10px',justifyContent:'space-between',flexShrink:0}},

/* ─── Group Card (identical gradient + characters as webapp) ──── */
const LADDER=[{nr:-8,br:-4},{nr:4,br:2},{nr:6,br:0},{nr:-10,br:7}];
function GroupCard({group,onOpen,compact=false}){
  const net=netOf(group),you=net.you||0,owe=you<-.01,owed=you>.01,col=owe?A6:G6;

    boxShadow:'0 6px 18px -8px rgba(20,60,35,.18)',
    width:compact?222:'100%',
  }},
    /* characters */
    e('div',{style:{display:'flex',justifyContent:'center',alignItems:'flex-end',gap:2,padding:compact?'16px 12px 0':'20px 16px 0',position:'relative',zIndex:1}},
      group.members.slice(0,4).map((id,i)=>{
        const sl=LADDER[i]||LADDER[0],p=P(id);
        return e('div',{key:id,style:{display:'flex',flexDirection:'column',alignItems:'center'}},

          e('div',{style:{transform:`rotate(${sl.br}deg)`,transformOrigin:'bottom center'}},

        ),

        e('span',{style:{display:'block',textAlign:'center',fontSize:10,fontWeight:800,letterSpacing:'.13em',textTransform:'uppercase',color:owe?A6:'rgba(100,220,130,.7)',marginBottom:6}},owed?"You're owed":owe?'You owe':'Status'),

          e('span',{style:{fontSize:compact?21:26,fontWeight:800,letterSpacing:'-.02em',color:col,fontVariantNumeric:'tabular-nums'}},owe||owed?'$'+fmt(Math.abs(you)):'✓ Settled'),
          e('div',{style:{width:compact?36:42,height:compact?36:42,borderRadius:'50%',border:`1.5px solid ${col}`,display:'flex',alignItems:'center',justifyContent:'center'}},
            e(Ico,{n:'arrowRight',sz:compact?14:17,col}),

      ),

  );
}

/* ─── HOME ────────────────────────────────────────────────────── */

        e('div',null,

        e('div',{style:{transform:'translateY(2px)'}},e(Char,{shape:PEOPLE.you.shape,color:PEOPLE.you.color,variant:'hero'})),

          e('div',{style:{fontSize:22,fontWeight:800,color:G6,letterSpacing:'-.02em',fontVariantNumeric:'tabular-nums'}},'$'+fmt(owed)),

        e('span',{style:{background:'#fff',border:`1px solid ${HL}`,borderRadius:99,minWidth:24,height:24,padding:'0 7px',display:'inline-grid',placeItems:'center',fontSize:12,fontWeight:700,color:MUT}},groups.length),

      e('button',{onClick:onAddExpense,style:{display:'flex',alignItems:'center',gap:6,background:G6,color:'#fff',border:'none',borderRadius:11,padding:'8px 13px',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 6px 14px -8px rgba(22,163,74,.7)'}},

    e('div',{style:{background:'rgba(255,255,255,.04)',borderRadius:20,margin:'0 16px',border:`1px solid ${HL}`,overflow:'hidden',boxShadow:'none'}},

        e('div',{style:{width:40,height:40,borderRadius:12,background:a.tint==='green'?G1:'rgba(255,255,255,.08)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
          e(Ico,{n:a.icon,sz:18,col:a.tint==='green'?G6:MUT}),

        e('div',{style:{flex:1,minWidth:0}},
          e('div',{style:{fontSize:13.5,fontWeight:500,color:INK2,lineHeight:1.35}},a.text),

function GroupsScreen({groups,onOpenGroup}){
  return e('div',{style:{paddingBottom:20,animation:'fadeUp .3s ease both'}},
    e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 20px 20px'}},
      e('h1',{style:{fontSize:26,fontWeight:800,letterSpacing:'-.025em',color:INK,margin:0}},'Your squads'),
      e('button',{style:{display:'flex',alignItems:'center',gap:6,background:G6,color:'#fff',border:'none',borderRadius:13,padding:'10px 15px',fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 8px 24px -10px rgba(34,197,94,.35)'}},
        e(Ico,{n:'plus',sz:16,col:'#fff'}),'New',
      ),

        e('button',{onClick:onClose,style:{width:34,height:34,borderRadius:17,background:'rgba(255,255,255,.1)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},
          e(Ico,{n:'x',sz:16,col:MUT}),

      ),
      step===1 && e('div',{key:'s1'},
        e('div',{style:{marginBottom:13}},

          e('input',{...inp,style:{...inp,width:'100%',border:`1.5px solid ${HL}`,borderRadius:13,padding:'12px 14px',fontSize:15,outline:'none',background:'rgba(255,255,255,.06)'},placeholder:'e.g. Dinner, Uber, Groceries',value:desc,onChange:ev=>setDesc(ev.target.value),autoFocus:true}),
        ),
        e('div',{style:{marginBottom:13}},
          e('label',{style:{fontSize:13,fontWeight:700,color:INK2,display:'block',marginBottom:7}},'How much?'),
          e('div',{style:{display:'flex',alignItems:'center',border:`1.5px solid ${HL}`,borderRadius:13,padding:'0 14px',background:'rgba(255,255,255,.06)'}},
            e('span',{style:{fontWeight:800,color:G6,fontSize:17}},'$'),
            e('input',{...inp,type:'number',min:0,step:'0.01',placeholder:'0.00',value:amount,onChange:ev=>setAmount(ev.target.value),style:{...inp,border:'none',outline:'none',padding:'12px 0',fontSize:17,fontWeight:700,width:'100%',background:'transparent',color:INK}}),
          ),
        ),
        e('div',{style:{marginBottom:18}},
          e('label',{style:{fontSize:13,fontWeight:700,color:INK2,display:'block',marginBottom:9}},'Who paid?'),
          e('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
            (group?group.members:['you']).map(id=>{
              const p=P(id),sel=paidBy===id;
              return e('div',{key:id,onClick:()=>setPaidBy(id),style:{display:'flex',alignItems:'center',gap:9,border:`1.5px solid ${sel?G4:HL}`,borderRadius:13,padding:'9px 14px',cursor:'pointer',background:sel?G0:'rgba(255,255,255,.06)'}},
                e('div',{style:{transform:'translateY(2px)'}},e(Char,{shape:p.shape,color:p.color,variant:'mini'})),
                e('span',{style:{fontWeight:600,fontSize:14,color:INK}},id==='you'?'You':p.name),
              );
            }),
          ),
        ),
        e('button',{disabled:!v1,onClick:()=>setStep(2),style:{width:'100%',height:52,borderRadius:16,background:v1?G6:HL,color:v1?'#fff':FNT,fontWeight:700,fontSize:15,border:'none',cursor:v1?'pointer':'default',fontFamily:'inherit',boxShadow:v1?'0 8px 18px -10px rgba(22,163,74,.7)':'none',transition:'all .15s'}},"Next: who's splitting? →"),
      ),
      step===2 && e('div',{key:'s2'},
        e('button',{onClick:()=>setStep(1),style:{background:'none',border:'none',color:G7,fontWeight:600,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginBottom:12,display:'flex',alignItems:'center',gap:5,padding:0}},
          e(Ico,{n:'arrowLeft',sz:16,col:G7}),'Back',
        ),
        e('div',{style:{fontSize:13,color:MUT,marginBottom:12}},'Select everyone who shared ',e('b',{style:{color:INK}},'"'+desc+'"')),
        e('div',{style:{display:'flex',flexDirection:'column',gap:8,marginBottom:12}},
          (group?group.members:['you']).map(id=>{
            const p=P(id),on=split.includes(id);
            return e('div',{key:id,onClick:()=>tog(id),style:{display:'flex',alignItems:'center',gap:12,padding:'11px 13px',border:`1.5px solid ${on?G4:HL}`,borderRadius:13,cursor:'pointer',background:on?G0:'rgba(255,255,255,.06)'}},
              e('div',{style:{transform:'translateY(2px)'}},e(Char,{shape:p.shape,color:p.color,variant:'mini'})),
              e('span',{style:{fontWeight:600,fontSize:15,flex:1,color:INK}},id==='you'?'You':p.name),
              on&&each>0&&e('span',{style:{color:MUT,fontSize:13,marginRight:10}},'$'+fmt(each)),
              e('div',{style:{width:23,height:23,borderRadius:'50%',border:`2px solid ${on?G6:HL}`,background:on?G6:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}},
                on&&e(Ico,{n:'check',sz:13,col:'#fff',sw:3}),
              ),
            );
          }),
        ),
        parseFloat(amount)>0&&e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(34,197,94,.1)',borderRadius:13,padding:'11px 15px',marginBottom:12}},
          e('span',{style:{color:MUT,fontSize:14}},'Total · $'+fmt(parseFloat(amount))),
          split.length>0&&e('span',{style:{fontWeight:700,fontSize:14,color:G7}},'$'+fmt(each)+' each'),
        ),
        e('button',{disabled:split.length===0,onClick:()=>onSave({desc,amount:parseFloat(amount),paidBy,split}),style:{width:'100%',height:52,borderRadius:16,background:split.length>0?G6:HL,color:split.length>0?'#fff':FNT,fontWeight:700,fontSize:15,border:'none',cursor:split.length>0?'pointer':'default',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8}},
          e(Ico,{n:'check',sz:16,col:split.length>0?'#fff':FNT,sw:3}),'Add expense',
        ),
      ),
    ),
  );
}

/* ─── TOAST ───────────────────────────────────────────────────── */
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2600);return()=>clearTimeout(t);},[]);
  return e('div',{style:{position:'absolute',bottom:92,left:16,right:16,zIndex:80,background:INK,color:'#fff',padding:'13px 18px',borderRadius:16,display:'flex',alignItems:'center',gap:10,fontWeight:600,fontSize:14,boxShadow:'0 8px 24px rgba(0,0,0,.4)',animation:'pop .3s ease both'}},
    e(Ico,{n:'check',sz:18,col:G3,sw:3}),msg,
  );
}

/* ─── BOTTOM TAB BAR ─────────────────────────────────────────── */
const TABS=[{id:'home',n:'home',lb:'Home'},{id:'groups',n:'users',lb:'Squads'},{id:'activity',n:'bell',lb:'Activity'},{id:'pay',n:'wallet',lb:'Payments'},{id:'me',n:'user',lb:'Me'}];
function TabBar({active,onChange,notif}){
  return e('div',{style:{position:'absolute',bottom:0,left:0,right:0,height:83,background:'rgba(14,17,14,.94)',backdropFilter:'blur(20px) saturate(1.4)',WebkitBackdropFilter:'blur(20px) saturate(1.4)',borderTop:'1px solid rgba(255,255,255,.08)',display:'flex',alignItems:'flex-start',paddingTop:10,zIndex:50}},
    TABS.map(t=>
      e('button',{key:t.id,onClick:()=>onChange(t.id),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,background:'none',border:'none',cursor:'pointer',padding:'4px 0',fontFamily:'inherit',WebkitTapHighlightColor:'transparent'}},
        e('div',{style:{width:44,height:28,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:14,background:active===t.id?G1:'transparent',position:'relative'}},
          e(Ico,{n:t.n,sz:20,col:active===t.id?G6:FNT}),
          t.id==='activity'&&notif&&e('div',{style:{position:'absolute',top:3,right:8,width:8,height:8,borderRadius:'50%',background:R5,border:'1.5px solid #F1F5F9'}}),
        ),
        e('span',{style:{fontSize:10,fontWeight:600,color:active===t.id?G6:FNT}},t.lb),
      )
    ),
    e('div',{style:{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,background:'#fff',borderRadius:3,opacity:.18}}),
  );
}

/* ─── APP ─────────────────────────────────────────────────────── */
function App(){
  const [tab,setTab]=useState('home');
  const [groupId,setGroupId]=useState(null);
  const [sheet,setSheet]=useState(null);
  const [toast,setToast]=useState(null);
  const [groups,setGroups]=useState(INIT_GROUPS);
  const activeGroup=groupId?groups.find(g=>g.id===groupId):null;
  function saveExpense({desc,amount,paidBy,split}){
    const g=activeGroup||groups[0];
    setGroups(prev=>prev.map(gr=>gr.id!==g.id?gr:{...gr,expenses:[...gr.expenses,{id:'e'+Date.now(),title:desc,amount,paidBy,split,date:'Just now'}],total:gr.total+amount}));
    setSheet(null);setToast('Expense added to '+g.name);
  }
  function openGroup(id){setGroupId(id);setTab('groups');}
  return e('div',{style:{position:'relative',width:365,height:790,overflow:'hidden',background:'#0D1210',fontFamily:"'Plus Jakarta Sans',system-ui,sans-serif"}},
    e(StatusBar,null),
    e('div',{className:'hs',style:{position:'absolute',top:56,bottom:83,left:0,right:0,overflowY:'auto',overflowX:'hidden'}},
      !groupId&&tab==='home'    && e(HomeScreen,   {key:'home',   groups,onOpenGroup:openGroup,onAddExpense:()=>setSheet('add')}),
      !groupId&&tab==='groups'  && e(GroupsScreen, {key:'groups', groups,onOpenGroup:openGroup}),
      !groupId&&tab==='activity'&& e(ActivityScreen,{key:'act'}),
      !groupId&&tab==='pay'     && e(PaymentsScreen,{key:'pay'}),
      !groupId&&tab==='me'      && e(ProfileScreen, {key:'me'}),
      groupId&&activeGroup      && e(GroupDetailScreen,{key:'gd-'+groupId,group:activeGroup,onBack:()=>setGroupId(null),onAddExpense:()=>setSheet('add')}),
    ),
    e(TabBar,{active:groupId?'groups':tab,onChange:id=>{setGroupId(null);setTab(id);},notif:true}),
    sheet==='add'&&e(AddExpenseSheet,{group:activeGroup||groups[0],onClose:()=>setSheet(null),onSave:saveExpense}),
    toast&&e(Toast,{msg:toast,onDone:()=>setToast(null)}),
  );
}

/* ─── HOST PAGE ──────────────────────────────────────────────── */
function Host(){
  const [scale,setScale]=React.useState(1);
  React.useEffect(()=>{
    function compute(){
      const vw=window.innerWidth,vh=window.innerHeight;
      const frameW=391,frameH=842;
      const availW=Math.min(vw-40,520),availH=vh-110;
      setScale(Math.min(availW/frameW,availH/frameH,1));
    }
    compute();
    window.addEventListener('resize',compute);
    return()=>window.removeEventListener('resize',compute);
  },[]);
  const frameH=842;
  return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',width:'100%'}},
    e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,marginBottom:16,textAlign:'center'}},
      e(Logo,{sz:20}),
      e('p',{style:{color:'rgba(255,255,255,.4)',fontSize:13,margin:0,fontWeight:500}},'iOS App · Interactive Prototype'),
    ),
    /* scaled phone wrapper */
    e('div',{style:{transformOrigin:'top center',transform:`scale(${scale})`,marginBottom:-(frameH*(1-scale))+4}},
      e('div',{style:{background:'#1C1C1E',borderRadius:54,padding:13,boxShadow:'0 0 0 1.5px #3A3A3A,0 40px 100px -20px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)',position:'relative',flexShrink:0}},
        /* dynamic island */
        e('div',{style:{position:'absolute',top:21,left:'50%',transform:'translateX(-50%)',width:120,height:34,background:'#000',borderRadius:20,zIndex:200}}),
        /* screen */
        e('div',{style:{borderRadius:44,overflow:'hidden',width:365,height:790,position:'relative'}},
          e(App,null),
        ),
        /* hardware buttons */
        e('div',{style:{position:'absolute',left:-3,top:128,width:3,height:32,background:'#3C3C3C',borderRadius:'3px 0 0 3px'}}),
        e('div',{style:{position:'absolute',left:-3,top:172,width:3,height:60,background:'#3C3C3C',borderRadius:'3px 0 0 3px'}}),
        e('div',{style:{position:'absolute',left:-3,top:244,width:3,height:60,background:'#3C3C3C',borderRadius:'3px 0 0 3px'}}),
        e('div',{style:{position:'absolute',right:-3,top:186,width:3,height:80,background:'#3C3C3C',borderRadius:'0 3px 3px 0'}}),
      ),
    ),
    e('p',{style:{color:'rgba(255,255,255,.3)',fontSize:11,marginTop:14,fontWeight:500}},'Tap to navigate · Scroll inside the phone'),
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(Host,null));
</script>
