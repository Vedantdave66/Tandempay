# NOT yet a required branch-protection check — this job is new and unproven.
# Watch it pass on a few PRs before adding it to required status checks.
name: E2E Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright-smoke:
    name: Playwright Smoke (Chromium)
    runs-on: ubuntu-latest

    # Ephemeral Postgres for this run only — never touches the real Supabase
    # production database. Schema is built fresh via `alembic upgrade head`
    # and the container (and its data) is discarded when the job ends.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tandempay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tandempay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/tandempay_test"
      SECRET_KEY: "ci-e2e-secret-key-not-used-in-production"
      ADMIN_SECRET: "ci-e2e-admin-secret"
      ENVIRONMENT: "test"
      FRONTEND_URL: "http://localhost:5173"
      # The disposable service container below has no SSL configured, unlike
      # Supabase's Transaction Pooler which app/database.py assumes by default.
      DB_SSL_REQUIRE: "false"
      E2E_TEST_EMAIL: "e2e-smoke@ci.tandempay.ca"
      E2E_TEST_PASSWORD: "E2eSmokePassword123!"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          # psycopg2 is Alembic-only (sync driver); the app itself uses asyncpg.
          # Not added to requirements.txt to avoid touching production deps.
          pip install psycopg2-binary

      - name: Apply migrations (alembic upgrade head)
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Start backend (uvicorn)
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health || { echo "Backend failed to start"; cat backend.log; exit 1; }

      - name: Seed test account
        run: |
          curl -sf -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"E2E Smoke\",\"email\":\"${E2E_TEST_EMAIL}\",\"password\":\"${E2E_TEST_PASSWORD}\"}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke test
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7
